openapi: 3.1.0
info:
  title: Franco Content API
  version: 1.0.0
  description: Server-to-server API for validated, staged learning content.
servers:
  - url: https://franco.example.com
paths:
  /api/content/v1/curriculum/review:
    get:
      description: Internal curriculum review queue with full lesson bodies and per-item provenance. Requires a content API key with content:review scope.
      security: [{ ContentApiKey: [] }]
      responses:
        '200': { description: Lessons with topic_id, review_status, version and pack_json }
        '401': { description: Missing or insufficiently scoped key }
  /api/me/stories:
    get:
      security: [{ LearnerSession: [] }]
      description: Ordered story adventure with per-user completed, skipped, current and locked states. Returns no answer keys; an empty collection is a valid rollout state.
      responses:
        '200': { description: Story summaries and saved learner states }
        '401': { description: Authentication required }
  /api/me/stories/{story_id}:
    get:
      security: [{ LearnerSession: [] }]
      parameters:
        - in: path
          name: story_id
          required: true
          schema: { type: string, pattern: '^story-[0-9]{2}$' }
      description: Read an unlocked story with six questions and English vocabulary support. Correct options and answer explanations remain private until grading.
      responses:
        '200': { description: Story, questions and saved correct question IDs }
        '401': { description: Authentication required }
        '403': { description: Finish or skip the current stop first }
        '404': { description: Story not found }
  /api/me/stories/{story_id}/{action}:
    post:
      security: [{ LearnerSession: [] }]
      parameters:
        - in: path
          name: story_id
          required: true
          schema: { type: string, pattern: '^story-[0-9]{2}$' }
        - in: path
          name: action
          required: true
          schema: { enum: [answer, skip] }
      description: Check one answer with unlimited retries, or skip. Six distinct correct answers or explicit skip unlock the next stop. Writes serialize per learner; repeats are idempotent and client-supplied user IDs or completion flags are never trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                question_id: { type: string }
                option_id: { type: string }
      responses:
        '200': { description: Saved state, correct question IDs and feedback }
        '400': { description: Invalid question, option or missing version }
        '401': { description: Authentication required }
        '403': { description: Locked-ahead story }
        '404': { description: Story not found }
        '409': { description: Story version changed; reload required }
  /api/me/puzzles/verb-sprint/runs:
    post:
      security: [{ LearnerSession: [] }]
      description: Start a 60-second Verb Sprint. Replaces only the learner's previous active Verb Sprint; French Rush remains separate.
      responses:
        '201': { description: Server-timed run and first conjugation choice question }
        '401': { description: Missing or expired session }
  /api/me/puzzles/verb-sprint/runs/{runId}:
    get:
      security: [{ LearnerSession: [] }]
      description: Resume a learner-owned sprint or obtain its final state after expiry.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Run state and current question, or null after finish }
        '401': { description: Missing or expired session }
        '404': { description: Run not found for this learner and game }
  /api/me/puzzles/verb-sprint/runs/{runId}/answer:
    post:
      security: [{ LearnerSession: [] }]
      description: Grade one opaque choice token, update score and streak, and return the next question. Duplicate or stale questions cannot score twice.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, response]
              properties:
                question_id: { type: string }
                response: { type: string, maxLength: 100, description: Opaque choice token from the current question }
      responses:
        '200': { description: Correctness, revealed answer, updated run and next question; timed_out when the server timer has expired }
        '400': { description: Invalid choice }
        '401': { description: Missing or expired session }
        '404': { description: Run not found for this learner and game }
        '409': { description: Stale question }
  /api/me/puzzles/verb-sprint/runs/{runId}/end:
    post:
      security: [{ LearnerSession: [] }]
      description: End a learner-owned sprint early.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Final run state }
        '401': { description: Missing or expired session }
        '404': { description: Run not found for this learner and game }
  /api/content/v1/curriculum/{topic_id}/review:
    post:
      description: Complete the next editorial stage. Approvals bind to exact content hash and version; publication validates all lesson sections and licensing. Revision invalidates earlier approvals.
      security: [{ ContentApiKey: [] }]
      parameters:
        - in: path
          name: topic_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, from, state, reviewer, note]
              properties:
                version: { type: integer, minimum: 1 }
                from: { type: string }
                state: { enum: [generated, factual_review, language_review, license_check, approved, published, revision_needed] }
                reviewer: { type: string, minLength: 1 }
                note: { type: string, minLength: 1 }
      responses:
        '200': { description: Topic and updated editorial state }
        '401': { description: Missing or insufficiently scoped key }
        '404': { description: Unknown topic }
        '409': { description: Stale lesson state or version }
        '422': { description: Invalid transition, incomplete lesson, missing approval or provenance failure }
  /api/me/conversation-targets:
    get:
      security: [{ LearnerSession: [] }]
      description: Read-only scenario and four suggestions from the learner's weakest tracked concepts, or starter concepts. Hints use authored examples and theory; opening one writes no data.
      parameters:
        - name: pick
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Rotates the scenario and suggestion pick without changing learner progress.
      responses:
        '200': { description: Scenario, message and suggestions with hint sentence/pointer; sentence is null for concepts without authored examples }
        '400': { description: Invalid pick }
        '401': { description: Missing or expired session }

  /api/auth/signup:
    post:
      description: Creates an unverified email/password account and sends a 24-hour verification link. No session is issued until email verification and login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8 }
                first_name: { type: string, minLength: 1 }
                last_name: { type: string, minLength: 1 }
      responses:
        '201': { description: Verification email sent; message returned, no session token }
        '400': { description: Invalid email, password or names }
        '409': { description: Account already exists }
        '429': { description: Signup rate limit reached }
        '503': { description: Email delivery is not configured or the provider rejected the message }
  /api/auth/login:
    post:
      description: Returns an opaque session only for a verified email/password account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Session token and user payload }
        '401': { description: Invalid credentials }
        '403': { description: Valid credentials but email unverified; code email_not_verified }
  /api/auth/verify-email:
    post:
      description: Consumes a 24-hour, single-use verification token from the email link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200': { description: Email verified; user may now log in }
        '400': { description: Invalid, expired or already used token }
  /api/auth/resend-verification:
    post:
      description: Sends another verification link only for an unverified account. Eligible and ineligible addresses receive the same 200 response; per-address and per-IP limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic response that does not reveal account status or rate-limit state }
        '503': { description: Email delivery is not configured, independent of account status }
  /api/auth/forgot-password:
    post:
      description: Sends a one-hour reset link for an account. Eligible and ineligible addresses receive the same 200 response; per-address and per-IP limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Generic response that does not reveal account status or rate-limit state }
        '503': { description: Email delivery is not configured, independent of account status }
  /api/auth/reset-password:
    post:
      description: Consumes a one-hour reset token, replaces the password with a fresh salt, invalidates all other reset tokens and revokes every session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset; existing sessions revoked }
        '400': { description: Weak password or invalid, expired or used token }

  /api/auth/google/status:
    get:
      responses:
        '200': { description: available is true only when all Google OAuth server settings are valid }
  /api/auth/google:
    get:
      description: Starts the Google authorization-code flow with PKCE, nonce and a single-use HTTP-only state cookie.
      responses:
        '302': { description: Redirect to Google }
        '503': { description: OAuth not configured or temporary capacity reached }
  /api/auth/google/callback:
    get:
      description: Verifies cookie-bound state and Google identity, finds/creates the email account, and issues the existing Franco session. Returns to the configured app URL with a token or friendly error in the fragment.
      responses:
        '302': { description: Return to Franco; fragment is consumed and immediately removed by the app }
        '503': { description: OAuth not configured }

  /api/me/translate:
    post:
      security: [{ LearnerSession: [] }]
      description: Translates a short phrase through the server-side Groq provider. No learner progress, review queue, or scheduling writes. Diary saves are scoped per account in browser storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 240 }
                source: { type: string, enum: [auto, fr, en], default: auto }
      responses:
        '200': { description: text, translation, source and target (fr/en) }
        '400': { description: Invalid phrase or direction }
        '401': { description: Missing or expired session }
        '429': { description: Translation capacity reached; retry later }
        '502': { description: Provider failed or returned invalid output }
        '503': { description: Provider not configured }
  /api/me/lesson-position:
    get:
      security: [{ LearnerSession: [] }]
      description: Latest active lesson, saved section, real roadmap position/count, and saved timestamp for the signed-in learner. Returns lesson null before any lesson is read.
      responses:
        '200': { description: Saved reading position }
        '401': { description: Missing or expired learner session }
    post:
      security: [{ LearnerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept_slug, section]
              properties:
                concept_slug: { type: string }
                section: { type: string, enum: [overview, theory, vocabulary, examples] }
      responses:
        '200': { description: Reading position saved for the session learner }
        '400': { description: Invalid section or slug }
        '401': { description: Missing or expired learner session }
        '404': { description: Active lesson not found }
  /api/me:
    get:
      security: [{ LearnerSession: [] }]
      description: >-
        The signed-in learner's user/profile, active concept progress states,
        50 most recent incorrect attempts (newest first), 100 recent attempts,
        and all 24 skill/CEFR aggregates. exercises_done counts distinct
        answered items, including incorrect answers; exercises_correct counts
        distinct items with at least one correct attempt. Retries cannot
        inflate completion. Inventory includes published current-revision
        content and the exam archive; pending/rejected content is excluded.
      responses:
        '200': { description: Learner snapshot; empty inventories have zero counts and percent }
        '401': { description: Missing or expired learner session }
  /api/me/attempts:
    post:
      security: [{ LearnerSession: [] }]
      description: >-
        Records and grades a learner answer. content_item uses item_id;
        exam_question and exercise use legacy_ref. Both correct and incorrect
        answers are stored; the response supplies correct, reveal and attempt.
        Speaking type-instead answers use completed true plus typed_text; this
        is stored as a typed completion, not as a provider-verified transcript.
      responses:
        '201': { description: Stored attempt and authoritative evaluation }
        '400': { description: Missing response or invalid item reference }
        '401': { description: Missing or expired learner session }
        '404': { description: Item not found }
  /api/content/v1/schema:
    get:
      security: []
      responses:
        '200': { description: JSON Schema content.v1 }
  /api/content/v1/batches:
    post:
      security: [{ ContentApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ContentBatch' } }
      responses:
        '202': { description: Batch staged for review }
        '401': { description: Missing or invalid scoped API key }
        '422': { description: Contract validation failed }
  /api/content/v1/batches/{id}:
    get:
      security: [{ ContentApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses: { '200': { description: Batch status }, '404': { description: Not found } }
  /api/content/v1/items:
    get:
      security: [{ ContentApiKey: [] }]
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [A1, A2, B1, B2, C1, C2] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated item types }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { '200': { description: Matching items and the total across all pages } }
  /api/content/v1/items/{id}/{action}:
    post:
      security: [{ ContentApiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject, publish] } }
      responses: { '200': { description: Updated content status } }
components:
  securitySchemes:
    LearnerSession:
      type: http
      scheme: bearer
      description: Opaque Franco session token (custom auth, not a Supabase JWT).
    ContentApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    BatchId: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    ContentBatch:
      $ref: https://franco.app/schemas/content.v1.schema.json
