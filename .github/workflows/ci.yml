name: CI

# Gate every pull request: UI boundary lint, TypeScript typecheck, tests, and
# a production build must all pass before a PR can look mergeable. Runs only
# on GitHub's free Actions tier with first-party actions — no paid or
# third-party actions.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same PR supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint:ui · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: franco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d franco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI boundary check (FRA-21)
        run: npm run lint:ui

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Test suite
        run: npm test

      - name: MCQ API integration
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/franco_test?sslmode=disable
        run: node scripts/test-mcq-api.mjs

      - name: Learn progress API integration
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/franco_test?sslmode=disable
        run: node scripts/test-learn-progress-api.mjs

      - name: Race lifecycle integration
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/franco_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/franco_test?sslmode=disable
        run: node scripts/test-race-lifecycle.mjs

      - name: Production build
        run: npm run build
