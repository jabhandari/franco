# FRA-33: free AI PR reviewer (Gemini Flash, $0)
#
# Posts an advisory review + plain-language summary on every PR.
# - Triggers: PR opened, new pushes, manual dispatch.
# - Advisory only: posts a comment, never approves, never blocks merge.
# - Noise controls: skips when the diff is unchanged since the last review;
#   previous findings are fed back so the model doesn't repeat them.
# - Model is configurable without code changes (see env below).
name: AI PR review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  # Change the model later without touching code: repo Settings →
  # Secrets and variables → Actions → Variables → new variable
  # GEMINI_MODEL (e.g. gemini-2.5-flash). Falls back to the default below.
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR refs
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Skip if already reviewed
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.refs.outputs.pr_number }}"
          HEAD_SHA="${{ steps.refs.outputs.head_sha }}"
          LAST=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '[.comments[] | select(.body | contains("AI review (Gemini"))] | last | .body // ""')
          REVIEWED_SHA=$(printf '%s' "$LAST" | sed -n 's/.*<!-- ai-review-sha:\([0-9a-f]*\) -->.*/\1/p')
          if [ -n "$REVIEWED_SHA" ] && [ "$REVIEWED_SHA" = "$HEAD_SHA" ]; then
            echo "Head $HEAD_SHA already reviewed — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            printf '%s' "$LAST" > /tmp/prev-review.md
          fi

      - name: Build diff and prompt
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.refs.outputs.base_sha }}"
          HEAD_SHA="${{ steps.refs.outputs.head_sha }}"
          git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)package-lock.json' ':(exclude)dist' \
            | head -c 60000 > /tmp/pr.diff
          {
            echo "PR title: $(gh pr view "${{ steps.refs.outputs.pr_number }}" --json title --jq .title)"
            echo ""
            echo "PR body:"
            gh pr view "${{ steps.refs.outputs.pr_number }}" --json body --jq .body
            echo ""
            echo "Diff (truncated to 60k chars):"
            cat /tmp/pr.diff
          } > /tmp/user-msg.txt
          if [ -s /tmp/prev-review.md ]; then
            {
              echo ""
              echo "Previous review findings (do NOT repeat these):"
              head -c 4000 /tmp/prev-review.md
            } >> /tmp/user-msg.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call Gemini
        if: steps.skip.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          jq -n --arg sys "$(cat .github/ai-pr-review-prompt.md)" \
                --arg msg "$(cat /tmp/user-msg.txt)" \
            '{system_instruction:{parts:[{text:$sys}]},
              contents:[{parts:[{text:$msg}]}],
              generationConfig:{temperature:0.2,maxOutputTokens:4096}}' > /tmp/req.json
          URL="https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent"
          for attempt in 1 2; do
            HTTP=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$URL?key=${GEMINI_API_KEY}" \
              -H 'Content-Type: application/json' -d @/tmp/req.json)
            if [ "$HTTP" = "200" ]; then break; fi
            echo "Gemini API returned $HTTP (attempt $attempt)"
            jq -r '.error.message // "no error detail"' /tmp/resp.json
            [ "$attempt" = "1" ] && sleep 60 || exit 1
          done
          jq -r '.candidates[0].content.parts[0].text // empty' /tmp/resp.json > /tmp/review.md
          [ -s /tmp/review.md ] || { echo "Empty review text"; exit 1; }

      - name: Post review comment
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.refs.outputs.pr_number }}"
          HEAD_SHA="${{ steps.refs.outputs.head_sha }}"
          {
            echo "## AI review (Gemini, advisory)"
            echo ""
            cat /tmp/review.md
            echo ""
            echo "<sub>Model: \`${GEMINI_MODEL}\` · reviewed commit \`${HEAD_SHA}\` · advisory only — does not block or approve.</sub>"
            echo "<!-- ai-review-sha:${HEAD_SHA} -->"
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
